<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Ứng dụng Flask{% endblock %}</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            min-height: 100vh;
        }

        /* thanh menu: các link nằm giữa */
        .navbar-custom {
            background: #2563eb;
            padding: 15px 25px;
            display: flex;
            justify-content: center;
            gap: 28px;
        }

        .navbar-custom a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding-bottom: 4px;
            border-bottom: 3px solid transparent;
        }

        .navbar-custom a:hover {
            color: #dbeafe;
        }

        /* gạch dưới tên trang đang đứng */
        .navbar-custom a.active {
            border-bottom: 3px solid white;
        }

        .page-content {
            padding: 35px 15px;
        }

        .khung {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .loi {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 9px 11px;
            border-radius: 7px;
            margin-top: 8px;
            font-size: 14px;
        }

        .nhom-nhap {
            margin-bottom: 20px;
        }

        .nhom-nhap label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .nhom-nhap input,
        .nhom-nhap select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .nhom-nhap input:focus,
        .nhom-nhap select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .nut-tinh {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .nut-tinh:hover {
            background: #1d4ed8;
        }

        .ket-qua {
            margin-top: 24px;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
        }

        .chan-trang {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 22px;
        }

        @media (max-width: 480px) {
            .khung {
                padding: 22px 18px;
            }

            .navbar-custom {
                padding: 12px;
                gap: 14px;
                flex-wrap: wrap;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body>

    <nav class="navbar-custom">
        <a href="{{ url_for('menu') }}" class="{% if request.endpoint == 'menu' %}active{% endif %}">Trang chủ</a>
        <a href="{{ url_for('may_tinh') }}" class="{% if request.endpoint == 'may_tinh' %}active{% endif %}">Máy tính</a>
        <a href="{{ url_for('tinh_diem') }}" class="{% if request.endpoint == 'tinh_diem' %}active{% endif %}">Tính điểm</a>
        <a href="{{ url_for('bmi') }}" class="{% if request.endpoint == 'bmi' %}active{% endif %}">BMI</a>
    </nav>

    <div class="page-content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
