<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Trang chủ{% endblock %} - Web Flask</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    body {
      background-color: #f0f2f5;
    }

    /* khung trắng chứa nội dung */
    .khung {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .khung h1 {
      font-size: 28px;
      margin-bottom: 15px;
      text-align: center;
    }

    /* gạch ngang dưới tên trang đang đứng */
    .navbar .nav-link.active {
      border-bottom: 3px solid white;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: gray;
      font-size: 13px;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <!-- thanh menu -->
  <nav class="navbar navbar-expand navbar-dark bg-primary">
    <div class="container">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Trang chủ</a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto align-items-center">

        {% if session.get('user') %}
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'profile' %}active{% endif %}" href="{{ url_for('profile') }}">Hồ sơ</a>
          </li>
          <li class="nav-item ms-2">
            <form method="post" action="{{ url_for('logout') }}" class="m-0">
              <button type="submit" class="btn btn-light btn-sm">Đăng xuất</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'login' %}active{% endif %}" href="{{ url_for('login') }}">Đăng nhập</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'register' %}active{% endif %}" href="{{ url_for('register') }}">Đăng ký</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </nav>

  <div class="container">

    <!-- hiện thông báo flash -->
    <div style="max-width: 500px; margin: 20px auto 0;">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} mb-2">{{ message }}</div>
        {% endfor %}
      {% endwith %}
    </div>

    <div class="khung">
      {% block content %}{% endblock %}
    </div>

  </div>

</body>
</html>
